name: appbeez_timesheet
description: AppBeez Timesheet Management System
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP calls (Flask API)
  http: ^1.1.0

  # Local storage (token, user data)
  shared_preferences: ^2.2.2

  # Icons
  cupertino_icons: ^1.0.6

  # File download support (Web)
  universal_html: ^2.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
